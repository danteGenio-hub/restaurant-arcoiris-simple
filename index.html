<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Arcoíris - Carta Digital</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Cabecera clásica -->
    <header class="header rainbow-neon-border">
        <div class="header-content">
            <div class="header-left">
                <div class="logo-container">
                    <img src="assets/img_logo/logo.webp" alt="Logo" class="logo">
                </div>
                <div class="header-text">
                    <h1>Restaurant Arcoíris</h1>
                    <p class="subtitle"><i class="fa-solid fa-utensils"></i> "Donde Jorgito" — Tradición y sabor chileno</p>
                </div>
            </div>
            <div class="header-contact">
                <div class="contact-item"><i class="fa-solid fa-phone"></i> +56959902927</div>
                <div class="contact-item"><i class="fa-solid fa-location-dot"></i> San Francisco 8430</div>
                <div class="contact-item"><i class="fa-brands fa-instagram"></i> Restaurant_arcoiris</div>
            </div>
        </div>
    </header>

    <!-- Contenedor de las imágenes de la carta (menu_2 arriba, menu_! abajo) -->
    <main class="menu-images-container">
        <div class="carta-card">
            <img src="assets/img_carta/menu_2.webp" alt="Menú Principal" class="carta-img">
        </div>
        <div class="carta-card">
            <img src="assets/img_carta/menu_!.webp" alt="Menú Picar y Tomar" class="carta-img">
        </div>
    </main>

    <!-- Pie de página -->
    <footer class="footer">
        <p>&copy; 2026 Restaurant Arcoíris - Todos los derechos reservados.</p>
    </footer>

</body>
</html>
